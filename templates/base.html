<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <title>Pitstop | Vehicle Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
        --color-neonBlue: #00f0ff;
        --color-racingRed: #ff003c;
        --color-darkBg: #121212;
        --color-cardBg: #1e1e1e;
      }
      @keyframes marquee {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-50%); }
}
.animate-marquee {
    animation: marquee 15s linear infinite;
    display: flex;
    width: max-content;
}
    </style>
</head>

<body class="bg-darkBg text-gray-200 font-sans antialiased">
    <nav class="p-4 border-b border-gray-800 flex justify-between items-center">
        <a href="/" class="text-2xl font-black italic tracking-wider text-racingRed">🏁 PITSTOP</a>
        <div class="space-x-6">
            <a href="/dashboard" class="hover:text-neonBlue transition">Dashboard</a>
            <a href="/garage" class="hover:text-neonBlue transition">Garage</a>
        </div>
    </nav>
    <main class="min-h-screen">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="max-w-7xl mx-auto py-6 px-4 text-center text-gray-500 text-sm">
            &copy; 2026 Pitstop. All rights reserved. | Designed with passion for automotive enthusiasts.
        </div>
    </footer>
</body>

</html>
